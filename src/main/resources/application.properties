spring.application.name=GestionAlquilerBack

# MySQL Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/gestion_alquiler?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
server.port=${PORT:8080}


# Jackson
spring.jackson.time-zone=America/Argentina/Buenos_Aires

# File upload
app.upload.dir=uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# JWT
jwt.secret=GestionAlquilerSecretKey2026SuperSeguraParaFirmarTokensJWT
jwt.expiration=86400000
